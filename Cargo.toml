[package]
name = "zql-conformance-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
path = "runner/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zql-native"
path = "runner/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zega = { git = "https://github.com/zegadb/zega.git", rev = "a992df2cfe19ccb86b87f2f99c8346f280d499ab" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
